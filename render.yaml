services:
  - type: web
    name: xtoolkit-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: WEB3FORMS_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
