services:
  - type: web
    name: xtoolkit-api
    runtime: docker
    dockerfilePath: ./artifacts/api-server/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: WEB3FORMS_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
